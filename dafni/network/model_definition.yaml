# DAFNI model definition (schema v1beta3):
# https://docs.secure.dafni.rl.ac.uk/docs/Reference/model-definition-reference
kind: M
api_version: v1beta3
metadata:
  display_name: Ouseburn synthetic sewer network (SWMManywhere)
  name: ouseburn-sewer-network
  type: model
  summary: >-
    Generates a synthetic sewer network and SWMM model for a bounding box with
    SWMManywhere (step 1 of the EURO-SAM 2026 Ouseburn pipeline).
  description: >-
    Step 1 of the EURO-SAM 2026 study "Hydraulically-informed graph learning for
    sewer monitoring under data sparsity" (Tetiana Starovoit, Manuel Herrera,
    Newcastle University). Runs SWMManywhere 0.2.4 on the lower Ouseburn,
    Newcastle upon Tyne (or any bounding box), using OpenStreetMap streets and
    rivers, building footprints and NASADEM elevation, then checks connectivity,
    outfalls, slopes and diameters. The result is a synthetic network, not
    utility asset records. Needs internet access during the run. Its .inp output
    is the input of the "Ouseburn hydraulic scenarios" model.
  publisher: Newcastle University
  contact_point_name: Manuel Herrera
  contact_point_email: manuel.herrera@newcastle.ac.uk
  source_code: https://github.com/manuelhf/EURO-SAM-2026
  subject: Utilities / Communication
  project_name: EURO-SAM 2026
  project_url: https://github.com/manuelhf/EURO-SAM-2026
  # licence: add a licence URL once the authors choose one (README: none yet)
spec:
  command: ["python", "/app/run_network.py"]
  inputs:
    parameters:
      - name: BBOX
        title: Bounding box
        description: >-
          "lon_min,lat_min,lon_max,lat_max" in WGS84 degrees. Leave empty to use
          the bbox in the configuration (lower Ouseburn:
          -1.6000,54.9645,-1.5820,54.9800).
        type: string
        default: ""
        required: false
    dataslots:
      - name: SWMManywhere configuration
        description: >-
          Optional. One .yml/.yaml SWMManywhere configuration that replaces the
          built-in ouseburn_config.yml (bounding box, parameter overrides,
          graph function list).
        path: inputs/network-config
        required: false
  outputs:
    datasets:
      - name: model_*.inp
        type: inp
        description: SWMM model generated by SWMManywhere (input of the scenarios model).
      - name: nodes.geoparquet
        type: geoparquet
        description: Junctions and outfalls.
      - name: edges.geoparquet
        type: geoparquet
        description: Conduits.
      - name: subcatchments.geoparquet
        type: geoparquet
        description: Sub-catchments.
      - name: graph.parquet
        type: parquet
        description: Network graph.
      - name: results.parquet
        type: parquet
        description: Short SWMM simulation results (flooding, flow, depth; long format).
      - name: network_checks.txt
        type: text
        description: Connectivity, outfall, slope and diameter checks.
      - name: outfalls.csv
        type: csv
        description: Outfalls with component size and distance to the river.
      - name: network_map.png
        type: png
        description: Map of sub-catchments, pipes and nodes.
      - name: components_map.png
        type: png
        description: Drainage systems, outfalls and the river.
      - name: ouseburn_config.yml
        type: yaml
        description: The SWMManywhere configuration actually used.
      - name: run_parameters.json
        type: json
        description: Parameters and configuration checksum of the run.
